[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "polymarket-bot"
version = "0.1.0"
description = "Autonomous Polymarket trading bot with layered risk management"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "py-clob-client>=0.34.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "web3>=6.15.0",
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "numpy>=1.26.0",
    "structlog>=24.1.0",
    "click>=8.1.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "respx>=0.21.0",
]

[project.scripts]
polybot = "polymarket_bot.cli.control:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks integration tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
