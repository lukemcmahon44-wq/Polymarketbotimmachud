[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-bot"
version = "0.1.0"
description = "Autonomous Polymarket trading bot with layered risk management"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "httpx>=0.27,<1",
    "websockets>=12,<14",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "pyyaml>=6.0,<7",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "web3>=6.15,<8",
    "eth-account>=0.11,<1",
    "structlog>=24.1,<26",
    "click>=8.1,<9",
    "rich>=13.7,<14",
    "py-clob-client>=0.15,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "respx>=0.21,<1",
    "mypy>=1.8,<2",
    "ruff>=0.3,<1",
]

[project.scripts]
polybot = "polymarket_bot.cli.main:cli"

[tool.setuptools.packages.find]
include = ["polymarket_bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
