# Polymarket Bot — Conservative Default Configuration
# All monetary values in USD. All times in seconds unless noted.
# WARNING: Live trading requires ENABLE_LIVE_TRADING=true AND runtime passphrase.

# ─── Trading Mode ────────────────────────────────────────────────
paper_mode: true
first_live_trades_manual_review: 10
live_passphrase: "I UNDERSTAND AND ENABLE LIVE TRADING"

# ─── Layer 0: Hard Limits ────────────────────────────────────────
global_exposure_usd: 10000.0
per_market_exposure_usd: 1000.0
per_trade_max_usd: 500.0
max_concurrent_positions: 10

# ─── Layer 1: Position Sizing ────────────────────────────────────
kelly_fraction: 0.25          # Quarter-Kelly for safety
min_liquidity_usd: 5000.0     # Skip illiquid markets
min_ev_threshold: 0.02        # Minimum EV (2%) to consider a signal
confidence_floor: 0.55        # Minimum model confidence

# ─── Layer 2: Execution Controls ─────────────────────────────────
slippage_tolerance_pct: 0.02  # 2% max slippage
max_fill_deviation_pct: 0.03  # 3% max fill price deviation
order_ttl_seconds: 120        # Auto-cancel unfilled orders after 2 min
prefer_limit_orders: true

# ─── Layer 3: Stop & Time Decay ──────────────────────────────────
stop_loss_pct: 0.15           # 15% stop loss
time_decay_hours: 168         # Exit positions after 7 days without resolution
trailing_stop_pct: 0.10       # 10% trailing stop

# ─── Layer 4: Portfolio Hedging ───────────────────────────────────
max_category_concentration_pct: 0.40  # Max 40% in one category
correlation_threshold: 0.70           # Flag correlated positions above 0.7

# ─── Layer 5: Circuit Breakers ────────────────────────────────────
max_drawdown_pct: 0.10         # Auto-halt at 10% drawdown
max_consecutive_losses: 5      # Halt after 5 consecutive losses
rpc_failure_threshold: 3       # Halt after 3 consecutive RPC failures
anomalous_fill_deviation: 0.10 # Flag fills deviating >10% from expected

# ─── Layer 6: Compliance ─────────────────────────────────────────
no_wash_trading: true
min_time_between_opposing_trades_seconds: 300

# ─── Scanner Settings ────────────────────────────────────────────
scanner:
  poll_interval_seconds: 10
  categories: ["crypto", "finance", "technology", "politics", "sports"]
  max_markets_to_track: 200
  websocket_enabled: true
  websocket_reconnect_delay_seconds: 5

# ─── API Rate Limits ─────────────────────────────────────────────
rate_limits:
  rest_requests_per_10s: 9000
  order_requests_per_10s: 3500
  backoff_base_seconds: 1.0
  backoff_max_seconds: 60.0
  backoff_multiplier: 2.0

# ─── Copy-Trade Detection ────────────────────────────────────────
copy_trade_detection:
  enabled: true
  time_window_seconds: 600
  similarity_threshold: 0.8
  min_matching_trades: 3
  response: "reduce_size"       # reduce_size | randomize_timing | flag_only
  size_reduction_factor: 0.5
  timing_randomize_seconds: 30

# ─── Monitoring & Alerts ─────────────────────────────────────────
monitoring:
  log_level: "INFO"
  structured_logging: true
  metrics_export_interval_seconds: 60
  alert_webhook_url: ""         # Set via ALERT_WEBHOOK_URL env var
  alert_on_circuit_breaker: true
  alert_on_large_fill: true
  large_fill_threshold_usd: 250.0

# ─── Backtest ─────────────────────────────────────────────────────
backtest:
  default_slippage_bps: 50
  default_latency_ms: 200
  monte_carlo_runs: 1000
  fee_rate: 0.02
